<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Real-Time Chat</div>
        <div id="messages" class="chat-messages">
            <!-- Messages will be dynamically added here -->
        </div>
        <div class="chat-input-container">
            <input type="text" id="messageInput" class="form-control" placeholder="Type a message...">
            <button onclick="sendMessage()" class="btn btn-primary">Send</button>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
        const ws = new WebSocket("ws://localhost:8000/ws/chat");
        const userName = prompt("Enter your username (User 1 or User 2):");

        ws.onmessage = function(event) {
            const messages = document.getElementById("messages");
            const messageData = JSON.parse(event.data); // Expecting { user: "User 1", message: "Hello" }
            
            const message = document.createElement("div");
            message.classList.add("message");
            
            // Add a specific class based on the sender
            if (messageData.user === userName) {
                message.classList.add("message-right");
            } else {
                message.classList.add("message-left");
            }

            message.innerHTML = `<strong>${messageData.user}:</strong> ${messageData.message}`;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight; // Auto-scroll to the latest message
        };

        function sendMessage() {
            const input = document.getElementById("messageInput");
            if (input.value.trim() !== "") {
                const messageData = {
                    user: userName,
                    message: input.value
                };
                ws.send(JSON.stringify(messageData));
                input.value = "";
            }
        }
    </script>
</body>
</html>
